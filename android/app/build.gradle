plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { keystoreProperties.load(it) }
}

gradle.taskGraph.whenReady { graph ->
    def releasing = graph.allTasks.any { it.name.toLowerCase().contains('release') }
    if (releasing && !keystoreProperties['storeFile'] && !project.hasProperty('ournest.allowDebugSigning')) {
        throw new GradleException(
            'Release signing key missing: create android/key.properties (see android/app/build.gradle). ' +
            'For a local test build only, add -Pournest.allowDebugSigning=true')
    }
}

android {
    namespace = "com.ournest.app"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.ournest.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 23
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // Audit F14: release builds used to be signed with the public DEBUG key.
    // Put your own upload key in android/key.properties (git-ignored):
    //   storeFile=C:/path/to/ournest-release.jks
    //   storePassword=...
    //   keyAlias=ournest
    //   keyPassword=...
    // Without it, a release build FAILS unless you explicitly pass
    //   -Pournest.allowDebugSigning=true   (local testing only, never publish)
    signingConfigs {
        if (keystoreProperties['storeFile']) {
            release {
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (keystoreProperties['storeFile']) {
                signingConfig = signingConfigs.release
            } else if (project.hasProperty('ournest.allowDebugSigning')) {
                logger.warn('WARNING: release build signed with the DEBUG key – do not publish this APK.')
                signingConfig = signingConfigs.debug
            } else {
                signingConfig = null
            }
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}
