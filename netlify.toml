[build]
  publish = "landing"

[[redirects]]
  from = "/OurNest-v1.2.1.apk"
  to = "/ournest.apk"
  status = 200

[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

[[headers]]
  for = "/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"OurNest-v1.2.1.apk\""
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.zip"
  [headers.values]
    Content-Type = "application/zip"
    Cache-Control = "no-cache"

