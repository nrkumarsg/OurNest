name: our_nest
description: "OurNest — Private, family-only messenger with shared alarms and end-to-end encryption."
publish_to: "none"
version: 1.2.3+6

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Dependency Injection
  flutter_riverpod: ^2.5.1

  # Navigation & Routing
  go_router: ^14.2.0

  # Supabase Client & Auth
  supabase_flutter: ^2.6.0

  # End-to-End Encryption (libsodium)
  sodium_libs: ^2.1.0

  # Secure Storage for Private Keys & Tokens
  flutter_secure_storage: ^9.2.2

  # Local Database / Cache
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # UI, Fonts & Assets
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # Media & Audio
  record: ^5.1.2
  audioplayers: ^6.0.0
  image_picker: ^1.1.2

  # Notifications, Alarms & Live GPS Location
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  url_launcher: ^6.3.0
  geolocator: ^13.0.1


  # Push notifications (FCM) – only active when FIREBASE_* dart-defines are set
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

dependency_overrides:
  record_platform_interface: 1.0.2
  record_web: 1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
